// Stub fluent: cada método retorna o próprio objeto (encadeável)
// e .then() resolve como uma Promise — evita crashes com credenciais placeholder
function _stubQuery(defaultData) {
  var r = { data: defaultData !== undefined ? defaultData : [], error: null };
  var q = {
    then:   function(fn, rej) { return Promise.resolve(r).then(fn, rej); },
    catch:  function(fn)      { return Promise.resolve(r).catch(fn); },
    select: function()        { return q; },
    eq:     function()        { return q; },
    neq:    function()        { return q; },
    order:  function()        { return q; },
    limit:  function()        { return q; },
    single: function()        { return _stubQuery(null); },
    insert: function()        { return q; },
    update: function()        { return q; },
    delete: function()        { return q; },
    upsert: function()        { return q; },
  };
  return q;
}

var supabase;
if (SUPABASE_CONFIGURED) {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
} else {
  supabase = {
    auth: {
      getSession:          function() { return Promise.resolve({ data: { session: null } }); },
      onAuthStateChange:   function() { return { data: { subscription: { unsubscribe: function(){} } } }; },

      signOut:             function() { return Promise.resolve(); },
    },
    from: function() { return _stubQuery(); },
  };
}

const MIME_TYPES = {
  pdf: 'application/pdf',
  xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
};

function downloadFile(filename) {
  const data = FILE_DATA[filename];
  if (!data) {
    alert('Este material será disponibilizado em breve!');
    return;
  }
  const ext = filename.split('.').pop().toLowerCase();
  const mime = MIME_TYPES[ext] || 'application/octet-stream';
  const link = document.createElement('a');
  link.href = `data:${mime};base64,${data}`;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

/* ─── AUTH ───────────────────────────────────────────────── */
function useAuth(){
  const [session,  setSession]  = useState(null);
  const [profile,  setProfile]  = useState(null);
  const [authLoading, setAuthLoading] = useState(true);

  const loadProfile = useCallback(async (uid) => {
    try{
      const {data, error} = await supabase.from('profiles').select('*').eq('id', uid).single();
      if(error) console.error('[ELITE] loadProfile error:', error.code, error.message);
      setProfile(data || null);
    }catch(e){
      console.error('[ELITE] loadProfile exception:', e);
      setProfile(null);
    }finally{
      setAuthLoading(false);
    }
  }, []);

  useEffect(()=>{
    supabase.auth.getSession()
      .then(({data:{session}})=>{
        setSession(session);
        if(session) loadProfile(session.user.id);
        else setAuthLoading(false);
      })
      .catch(()=> setAuthLoading(false));

    const {data:{subscription}} = supabase.auth.onAuthStateChange((_,session)=>{
      setSession(session);
      if(session) loadProfile(session.user.id);
      else { setProfile(null); setAuthLoading(false); }
    });
    return ()=> subscription.unsubscribe();
  },[loadProfile]);

  const login = async (email, password) => {
    const {error} = await supabase.auth.signInWithPassword({email, password});
    if(error) throw error;
  };

  const logout = async () => {
    await supabase.auth.signOut();
  };

  const auth = !!session;
  const role = profile?.role || session?.user?.app_metadata?.role || 'member';
  return {auth, role, profile, authLoading, login, logout};
}

/* ─── MODAL ──────────────────────────────────────────────── */
function Modal({open,onClose,children}){
  useEffect(()=>{
    document.body.style.overflow=open?'hidden':'';
    return()=>{document.body.style.overflow='';};
  },[open]);
  if(!open)return null;
  return(
    <div className="fixed inset-0 z-[200] flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-ink-950/80 backdrop-blur-sm" onClick={onClose}/>
      <div className="relative z-10 w-full max-w-2xl max-h-[90vh] overflow-y-auto fade-up">
        {children}
      </div>
    </div>
  );
}

function LoginPage({onLogin,onBack}){
  const[email,setEmail]=useState('');
  const[password,setPassword]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);
  const[resetMode,setResetMode]=useState(false);
  const[resetSent,setResetSent]=useState(false);

  const handleSubmit=async e=>{
    e.preventDefault(); setErr(''); setLoading(true);
    try{
      await onLogin(email,password);
    }catch(e){
      const msgs={
        'Invalid login credentials':'E-mail ou senha incorretos.',
        'Email not confirmed':'Confirme seu e-mail antes de entrar.',
        'Too many requests':'Muitas tentativas. Aguarde alguns minutos.',
      };
      setErr(msgs[e.message]||'Erro ao entrar. Tente novamente.');
    }finally{
      setLoading(false);
    }
  };

  const handleReset=async e=>{
    e.preventDefault(); setErr(''); setLoading(true);
    try{
      const{error}=await supabase.auth.resetPasswordForEmail(email,{
        redirectTo: window.location.origin+window.location.pathname,
      });
      if(error) throw error;
      setResetSent(true);
    }catch(e){
      setErr('Não foi possível enviar o e-mail. Verifique o endereço e tente novamente.');
    }finally{
      setLoading(false);
    }
  };

  return(
    <div className="min-h-screen bg-ink-950 flex flex-col items-center justify-center px-5 relative overflow-hidden gold-glow">
      <div className="w-full max-w-md bg-ink-900 border border-ink-600 rounded-lg p-8 sm:p-10 relative z-10 fade-up">
        <div className="flex flex-col items-center gap-4 mb-8">
          <EliteLogo size="lg"/>
          <span className="text-[10px] text-gold-500 tracked uppercase font-semibold">Acesso do membro</span>
        </div>

        {!resetMode ? <>
          <h2 className="text-xl font-medium text-ink-50 mb-2 tracking-tight">Entrar na plataforma</h2>
          <p className="text-ink-300 text-sm mb-6 leading-relaxed">Use o e-mail e senha cadastrados para acessar.</p>

          <form onSubmit={handleSubmit} className="space-y-3">
            <div>
              <label className="block text-[11px] font-medium text-ink-200 mb-1.5 tracked uppercase">E-mail</label>
              <input type="email" required autoComplete="email" value={email}
                onChange={e=>setEmail(e.target.value)}
                className="w-full px-4 py-3 bg-ink-950 border border-ink-600 rounded-md text-ink-50 text-sm transition-colors hover:border-ink-500 focus:border-gold-500 outline-none"
                placeholder="seu@email.com"/>
            </div>
            <div>
              <label className="block text-[11px] font-medium text-ink-200 mb-1.5 tracked uppercase">Senha</label>
              <input type="password" required autoComplete="current-password" value={password}
                onChange={e=>setPassword(e.target.value)}
                className="w-full px-4 py-3 bg-ink-950 border border-ink-600 rounded-md text-ink-50 text-sm transition-colors hover:border-ink-500 focus:border-gold-500 outline-none"
                placeholder="••••••••"/>
            </div>
            {err&&<p className="text-xs text-red-400 pt-1">{err}</p>}
            <button type="submit" disabled={loading||!email||!password}
              className="btn-gold w-full py-3.5 text-sm font-medium rounded-md tracked-tight uppercase flex items-center justify-center gap-2 disabled:opacity-60 mt-2">
              {loading
                ?<><span className="w-3.5 h-3.5 border-2 border-ink-950 border-t-transparent rounded-full spin"/>Entrando...</>
                :<>Entrar <I p={ic.arrowright} s={14}/></>}
            </button>
          </form>

          <div className="mt-5 text-center">
            <button onClick={()=>{setResetMode(true);setErr('');}}
              className="text-xs text-ink-400 hover:text-gold-500 transition-colors">
              Esqueci minha senha
            </button>
          </div>
        </> : <>
          <h2 className="text-xl font-medium text-ink-50 mb-2 tracking-tight">Recuperar senha</h2>

          {resetSent ? (
            <div className="bg-gold-500/10 border border-gold-500/30 rounded-md p-5 text-center">
              <I p={ic.check} s={24} c="text-gold-500 mx-auto mb-3"/>

              <p className="text-xs text-ink-300">Verifique sua caixa de entrada e clique no link para criar uma nova senha.</p>

                className="btn-gold w-full py-3.5 text-sm font-medium rounded-md tracked-tight uppercase flex items-center justify-center gap-2 disabled:opacity-60 mt-2">

/* ─── CALCULADORA DE PRECIFICAÇÃO ───────────────────────── */
function PricingCalc(){
  const[custo,setCusto]=useState('');
  const[frete,setFrete]=useState('');
  const[outros,setOutros]=useState('');
  const[margem,setMargem]=useState('30');
  const[comissao,setComissao]=useState('0');

  const c=parseFloat(custo)||0, f=parseFloat(frete)||0, o=parseFloat(outros)||0;
  const m=parseFloat(margem)||0, cm=parseFloat(comissao)||0;
  const total=c+f+o;
  const desc=(m+cm)/100;
  const preco=(desc<1&&total>0)?total/(1-desc):0;
  const lucro=preco*(m/100);
  const markup=total>0?((preco/total)-1)*100:0;
  const fmt=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const ok=total>0&&preco>0;

  const inp="w-full bg-ink-800 border border-ink-600 rounded-md py-2.5 text-sm text-ink-50 placeholder-ink-600 focus:outline-none focus:border-gold-500/60 transition-colors";

  return(
    <div className="bg-ink-900 border border-gold-500/20 rounded-lg p-6 mb-6">
      <div className="flex items-center gap-3 mb-5">
        <div className="w-9 h-9 bg-gold-500/10 border border-gold-500/30 rounded-md flex items-center justify-center text-gold-500 shrink-0">

      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-5">
        <div>
          <label className="text-[10px] font-medium text-ink-400 tracked uppercase block mb-1.5">Custo no atacado *</label>
          <div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400 text-xs font-medium">R$</span>
            <input type="number" min="0" step="0.01" value={custo} onChange={e=>setCusto(e.target.value)} placeholder="0,00" className={inp+" pl-8 pr-3"}/></div>
        </div>
        <div>
          <label className="text-[10px] font-medium text-ink-400 tracked uppercase block mb-1.5">Frete por peça</label>
          <div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400 text-xs font-medium">R$</span>
            <input type="number" min="0" step="0.01" value={frete} onChange={e=>setFrete(e.target.value)} placeholder="0,00" className={inp+" pl-8 pr-3"}/></div>
        </div>
        <div>
          <label className="text-[10px] font-medium text-ink-400 tracked uppercase block mb-1.5">Outros custos (embalagem…)</label>
          <div className="relative"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400 text-xs font-medium">R$</span>
            <input type="number" min="0" step="0.01" value={outros} onChange={e=>setOutros(e.target.value)} placeholder="0,00" className={inp+" pl-8 pr-3"}/></div>
        </div>
        <div>
          <label className="text-[10px] font-medium text-ink-400 tracked uppercase block mb-1.5">Margem de lucro desejada</label>
          <div className="relative">
            <input type="number" min="1" max="99" value={margem} onChange={e=>setMargem(e.target.value)} className={inp+" pl-3 pr-8"}/>
            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-ink-400 text-xs font-medium">%</span></div>
        </div>
        <div>
          <label className="text-[10px] font-medium text-ink-400 tracked uppercase block mb-1.5">Comissão da plataforma (Shopee…)</label>

            Limpar
          </button>
        </div>
      </div>

      <div className={`grid grid-cols-2 sm:grid-cols-4 gap-3 pt-5 border-t border-ink-700 transition-opacity ${ok?'opacity-100':'opacity-40'}`}>
        <div className="bg-gold-500/10 border border-gold-500/30 rounded-lg p-4 col-span-2 sm:col-span-1">
          <p className="text-[9px] font-semibold text-gold-500 tracked uppercase mb-1">Preço de Venda</p>
          <p className="text-xl font-bold text-gold-400 tracking-tight">{ok?fmt(preco):'—'}</p>

function ChecklistPanel(){
  const key='elite_checklist';
  const[checked,setChecked]=useState(()=>{
    try{return JSON.parse(localStorage.getItem(key)||'[]');}catch{return[];}
  });

  const toggle=id=>{
    setChecked(prev=>{
      const next=prev.includes(id)?prev.filter(x=>x!==id):[...prev,id];
      localStorage.setItem(key,JSON.stringify(next));
      return next;
    });
  };
  const reset=()=>{setChecked([]);localStorage.removeItem(key);};
  const pct=Math.round((checked.length/CHECKLIST_ITEMS.length)*100);
  const groups=[...new Set(CHECKLIST_ITEMS.map(i=>i.group))];

  return(
    <div className="bg-ink-900 border border-ink-600 rounded-lg p-6">
      <div className="flex items-center justify-between mb-5">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 bg-ink-800 border border-ink-600 rounded-md flex items-center justify-center text-ink-200 shrink-0">
            <I p={ic.check} s={17}/>
          </div>
          <div>
            <h2 className="text-sm font-semibold text-ink-50 tracking-tight">Checklist — Excursão ao Brás</h2>
            <p className="text-[10px] text-ink-400 mt-0.5">{checked.length} de {CHECKLIST_ITEMS.length} itens — {pct}% concluído</p>
          </div>
        </div>
        <button onClick={reset} className="text-[10px] text-ink-500 hover:text-red-400 transition-colors tracked uppercase font-medium">Reiniciar</button>
      </div>

      <div className="w-full bg-ink-800 rounded-full h-1.5 mb-6">
        <div className="bg-gold-500 h-1.5 rounded-full transition-all duration-500" style={{width:pct+'%'}}/>
      </div>

      <div className="space-y-5">
        {groups.map(g=>(
          <div key={g}>
            <p className="text-[9px] font-semibold text-gold-500 tracked uppercase mb-2.5">{g}</p>
            <div className="space-y-1.5">
              {CHECKLIST_ITEMS.filter(i=>i.group===g).map(item=>(
                <button key={item.id} onClick={()=>toggle(item.id)}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-md text-left transition-colors ${checked.includes(item.id)?'bg-gold-500/10 border border-gold-500/20':'bg-ink-800 border border-transparent hover:border-ink-600'}`}>
                  <div className={`w-4 h-4 rounded border flex items-center justify-center shrink-0 transition-colors ${checked.includes(item.id)?'bg-gold-500 border-gold-500':'border-ink-500'}`}>
                    {checked.includes(item.id)&&<I p={["M20 6L9 17l-5-5"]} s={10} c="text-ink-950"/>}
                  </div>
                  <span className={`text-xs leading-snug ${checked.includes(item.id)?'text-ink-300 line-through':'text-ink-100'}`}>{item.label}</span>
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── ADMIN PANEL ────────────────────────────────────────── */
function AdminPanel({onSaved}){
  const emptyForm={name:'',category:'Feminino',subcategory:'',location:'',whatsapp:'',instagram:'',box_number:'',min_order:'',shipping:'',image_url:'',is_factory:false};
  const[list,setList]=useState([]);
  const[loading,setLoading]=useState(true);
  const[formOpen,setFormOpen]=useState(false);
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState(emptyForm);
  const[formErr,setFormErr]=useState('');
  const[saving,setSaving]=useState(false);
  const[deleting,setDeleting]=useState(null);
  const[search,setSearch]=useState('');

  const loadList=useCallback(async()=>{
    setLoading(true);
    const{data}=await supabase.from('suppliers').select('*').order('name');
    setList(data||[]);
    setLoading(false);
  },[]);

  useEffect(()=>{loadList();},[loadList]);

  const openNew=()=>{setEditId(null);setForm(emptyForm);setFormErr('');setFormOpen(true);};
  const openEdit=s=>{
    setEditId(s.id);
    setForm({name:s.name,category:s.category,subcategory:s.subcategory,location:s.location,
      whatsapp:s.whatsapp||'',instagram:s.instagram||'',box_number:s.box_number||'',
      min_order:s.min_order||'',shipping:s.shipping||'',image_url:s.image_url||'',is_factory:!!s.is_factory});
    setFormErr('');setFormOpen(true);
  };

  const handleSave=async e=>{
    e.preventDefault();
    if(!form.name.trim()||!form.subcategory.trim()||!form.location.trim()){
      setFormErr('Preencha nome, subcategoria e localização.');return;
    }
    setSaving(true);setFormErr('');
    const payload={...form,active:true};
    const{error}=editId
      ?await supabase.from('suppliers').update(payload).eq('id',editId)
      :await supabase.from('suppliers').insert(payload);
    setSaving(false);
    if(error){setFormErr('Erro: '+error.message);return;}
    setFormOpen(false);
    loadList();
    if(onSaved)onSaved();
  };

  const toggleActive=async s=>{
    await supabase.from('suppliers').update({active:!s.active}).eq('id',s.id);
    loadList();if(onSaved)onSaved();
  };

  const handleDelete=async id=>{
    if(!window.confirm('Remover este fornecedor permanentemente?'))return;
    setDeleting(id);
    await supabase.from('suppliers').delete().eq('id',id);
    setDeleting(null);loadList();if(onSaved)onSaved();
  };

  const f=list.filter(s=>s.name.toLowerCase().includes(search.toLowerCase())||s.category.toLowerCase().includes(search.toLowerCase()));

  return(
    <div className="space-y-5 fade-up">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-xl font-medium text-ink-50 tracking-tight">Painel Admin</h2>
          <p className="text-xs text-ink-400 mt-1">{list.length} fornecedor{list.length!==1?'es':''} cadastrado{list.length!==1?'s':''}</p>
        </div>
        <button onClick={openNew} className="btn-gold flex items-center gap-2 px-4 py-2.5 rounded-md text-sm font-medium tracked-tight uppercase">
          <I p={ic.plus} s={14}/> Novo
        </button>
      </div>

      <div className="relative">
        <I p={ic.search} s={16} c="absolute left-3 top-1/2 -translate-y-1/2 text-ink-400"/>
        <input type="text" placeholder="Buscar fornecedor..." value={search} onChange={e=>setSearch(e.target.value)}
          className="w-full pl-10 pr-4 py-3 bg-ink-900 border border-ink-600 rounded-md text-ink-50 text-sm hover:border-ink-500 focus:border-gold-500 outline-none transition-colors"/>
      </div>

      {loading?(
        <div className="flex justify-center py-20"><span className="w-6 h-6 border-2 border-gold-500 border-t-transparent rounded-full spin"/></div>
      ):f.length===0?(
        <div className="text-center py-16 text-ink-400">
          <I p={ic.search} s={40} c="text-ink-600 mx-auto mb-3"/>
          <p>{search?'Nenhum resultado.':'Nenhum fornecedor. Clique em Novo para adicionar.'}</p>
        </div>
      ):(
        <div className="bg-ink-900 border border-ink-600 rounded-lg overflow-hidden">
          {f.map((s,i)=>(
            <div key={s.id} className={`flex items-center gap-4 p-4${i>0?' border-t border-ink-700':''}`}>
              <img src={s.image_url||'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=80'} alt=""

                  placeholder="Ex: Polo do Brás"/>
              </div>
              <div className="sm:col-span-2">
                <label className="block text-[11px] font-medium text-ink-200 mb-1.5 tracked uppercase">Localização *</label>
                <input value={form.location} onChange={e=>setForm(f=>({...f,location:e.target.value}))} required
                  className="w-full px-4 py-3 bg-ink-950 border border-ink-600 rounded-md text-ink-50 text-sm focus:border-gold-500 outline-none transition-colors"
                  placeholder="Ex: Brás – SP"/>
              </div>
              <div>
                <label className="block text-[11px] font-medium text-ink-200 mb-1.5 tracked uppercase">WhatsApp</label>
                <input value={form.whatsapp} onChange={e=>setForm(f=>({...f,whatsapp:e.target.value}))}
                  className="w-full px-4 py-3 bg-ink-950 border border-ink-600 rounded-md text-ink-50 text-sm focus:border-gold-500 outline-none transition-colors"
                  placeholder="5511999999999"/>
              </div>
              <div>
                <label className="block text-[11px] font-medium text-ink-200 mb-1.5 tracked uppercase">Instagram</label>
                <input value={form.instagram} onChange={e=>setForm(f=>({...f,instagram:e.target.value}))}
                  className="w-full px-4 py-3 bg-ink-950 border border-ink-600 rounded-md text-ink-50 text-sm focus:border-gold-500 outline-none transition-colors"
                  placeholder="@usuario"/>
              </div>
              <div>
                <label className="block text-[11px] font-medium text-ink-200 mb-1.5 tracked uppercase">Box / Loja</label>
                <input value={form.box_number} onChange={e=>setForm(f=>({...f,box_number:e.target.value}))}
                  className="w-full px-4 py-3 bg-ink-950 border border-ink-600 rounded-md text-ink-50 text-sm focus:border-gold-500 outline-none transition-colors"
                  placeholder="Ex: Box 31, Galeria Crystal"/>
              </div>
              <div>
                <label className="block text-[11px] font-medium text-ink-200 mb-1.5 tracked uppercase">Pedido mínimo</label>
                <input value={form.min_order} onChange={e=>setForm(f=>({...f,min_order:e.target.value}))}
                  className="w-full px-4 py-3 bg-ink-950 border border-ink-600 rounded-md text-ink-50 text-sm focus:border-gold-500 outline-none transition-colors"
                  placeholder="Ex: 12 peças"/>
              </div>
              <div className="sm:col-span-2">
                <label className="block text-[11px] font-medium text-ink-200 mb-1.5 tracked uppercase">Envio / Descrição</label>
                <input value={form.shipping} onChange={e=>setForm(f=>({...f,shipping:e.target.value}))}
                  className="w-full px-4 py-3 bg-ink-950 border border-ink-600 rounded-md text-ink-50 text-sm focus:border-gold-500 outline-none transition-colors"
                  placeholder="Ex: Envia para todo Brasil"/>
              </div>
              <div className="sm:col-span-2">
                <label className="block text-[11px] font-medium text-ink-200 mb-1.5 tracked uppercase">URL da imagem</label>
                <input value={form.image_url} onChange={e=>setForm(f=>({...f,image_url:e.target.value}))}
                  className="w-full px-4 py-3 bg-ink-950 border border-ink-600 rounded-md text-ink-50 text-sm focus:border-gold-500 outline-none transition-colors"
                  placeholder="https://..."/>
              </div>
              <div className="sm:col-span-2 flex items-center gap-3">
                <input type="checkbox" id="adm_is_factory" checked={form.is_factory}
                  onChange={e=>setForm(f=>({...f,is_factory:e.target.checked}))}
                  className="w-4 h-4 accent-[#d4af37]"/>
                <label htmlFor="adm_is_factory" className="text-sm text-ink-200">Fabricante direto (fábrica)</label>
              </div>
            </div>
            {formErr&&<p className="text-xs text-red-400">{formErr}</p>}
            <div className="flex gap-3 pt-2">
              <button type="submit" disabled={saving}
                className="btn-gold flex-1 py-3 text-sm font-medium rounded-md tracked-tight uppercase flex items-center justify-center gap-2 disabled:opacity-60">
                {saving?<><span className="w-3.5 h-3.5 border-2 border-ink-950 border-t-transparent rounded-full spin"/>Salvando...</>:'Salvar'}
              </button>
              <button type="button" onClick={()=>setFormOpen(false)}
                className="px-5 py-3 text-sm font-medium rounded-md text-ink-300 hover:text-ink-50 hover:bg-ink-800 transition-colors tracked-tight uppercase">
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </Modal>
    </div>
  );
}

function Dashboard({role,onLogout}){
  const[tab,setTab]=useState('suppliers');
  const[cat,setCat]=useState('Todos');
  const[sub,setSub]=useState(null);
  const[q,setQ]=useState('');
  const[favs,setFavs]=useState([]);
  const[selSupplier,setSelSupplier]=useState(null);
  const[selVideo,setSelVideo]=useState(null);
  const[selPrompt,setSelPrompt]=useState(null);
  const[copiedId,setCopiedId]=useState(null);
  const[notes,setNotes]=useState({});
  const[compareList,setCompareList]=useState([]);
  const[dbSuppliers,setDbSuppliers]=useState([]);
  const[suppLoading,setSuppLoading]=useState(true);

  const normalizeSupplier=s=>({
    id:s.id, name:s.name, category:s.category, subcategory:s.subcategory,
    location:s.location, whatsapp:s.whatsapp||'', instagram:s.instagram||'',
    boxNumber:s.box_number||s.boxNumber||'', minOrder:s.min_order||s.minOrder||'Sob consulta',
    shipping:s.shipping||'', image:s.image_url||s.image||'',
    isFactory:s.is_factory!==undefined?s.is_factory:(s.isFactory||false),
  });

  const loadSuppliers=useCallback(()=>{
    supabase.from('suppliers').select('*').eq('active',true).order('name')
      .then(({data,error})=>{
        if(!error && data && data.length>0) setDbSuppliers(data.map(normalizeSupplier));
        else setDbSuppliers(SUPPLIERS);
        setSuppLoading(false);
      });
  },[]);

  // Carrega fornecedores do Supabase; usa array local como fallback
  useEffect(()=>{ loadSuppliers(); },[loadSuppliers]);

  // Carrega favoritos do Supabase
  useEffect(()=>{
    supabase.from('favorites').select('supplier_id')
      .then(({data})=>{ if(data) setFavs(data.map(f=>f.supplier_id)); });
  },[]);

  // Carrega notas do localStorage (sem necessidade de tabela extra)
  useEffect(()=>{
    try{ const saved=localStorage.getItem('elite_notes'); if(saved) setNotes(JSON.parse(saved)); }catch{}
  },[]);

  const saveNote=(supplierId,text)=>{
    setNotes(prev=>{
      const next={...prev,[supplierId]:text};
      localStorage.setItem('elite_notes',JSON.stringify(next));
      return next;
    });
  };

  const toggleCompare=(supplier)=>{
    setCompareList(prev=>{
      if(prev.find(s=>s.id===supplier.id)) return prev.filter(s=>s.id!==supplier.id);
      if(prev.length>=3) return prev;
      return [...prev,supplier];
    });
  };

  useEffect(()=>{ setSub(null); },[cat]);

  const toggleFav=async (e,id)=>{
    e.stopPropagation();
    if(favs.includes(id)){
      setFavs(f=>f.filter(x=>x!==id));
      await supabase.from('favorites').delete().eq('supplier_id',id);
    }else{
      setFavs(f=>[...f,id]);
      await supabase.from('favorites').insert({supplier_id:id});
    }
  };
  const isFav=id=>favs.includes(id);

  const suppliers=dbSuppliers;
  const subs=[...new Set(suppliers.filter(s=>cat==='Todos'||s.category===cat).map(s=>s.subcategory))];
  const filtered=suppliers.filter(s=>{
    if(cat==='Favoritos'&&!favs.includes(s.id))return false;
    if(cat!=='Todos'&&cat!=='Favoritos'&&s.category!==cat)return false;
    if(sub&&s.subcategory!==sub)return false;
    const sq=q.toLowerCase();
    return s.name.toLowerCase().includes(sq)||s.subcategory.toLowerCase().includes(sq)||s.location.toLowerCase().includes(sq);
  });

  const openWA=(phone,name,fallbackInstagram)=>{
    const cleanPhone=phone?String(phone).replace(/\D/g,''):'';
    if(cleanPhone){
      const txt=encodeURIComponent(`Olá, vi seu contato na Plataforma de Fornecedores do Brasil e gostaria de saber mais sobre o catálogo de ${name}.`);
      window.open(`https://wa.me/${cleanPhone}?text=${txt}`,'_blank');
    } else if(fallbackInstagram){
      const igUser=fallbackInstagram.replace('@','').trim();
      alert(`Esta loja atende somente via Instagram Direct.\nVocê será redirecionado para ${fallbackInstagram}.`);
      window.open(`https://instagram.com/${igUser}`,'_blank');
    } else {
      alert('Contato indisponível no momento. Tente outro fornecedor.');
    }
  };
  const openIG=(user,fallbackPhone,name)=>{
    const igUser=user?user.replace('@','').trim():'';
    if(igUser){
      window.open(`https://instagram.com/${igUser}`,'_blank');
    } else {
      const cleanPhone=fallbackPhone?String(fallbackPhone).replace(/\D/g,''):'';
      if(cleanPhone){
        alert('Esta loja atende somente via WhatsApp. Você será redirecionado.');
        const txt=encodeURIComponent(`Olá, vi seu contato na Plataforma de Fornecedores do Brasil e gostaria de saber mais sobre o catálogo de ${name||''}.`);

        alert('Contato indisponível no momento.');
      }

          <nav className="flex-1 px-3 py-5 space-y-0.5 overflow-y-auto hide-scroll">
            <p className="text-[9px] font-medium text-ink-400 tracked uppercase px-3 mb-3">Portal</p>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors text-sm ${tab===t.id?'bg-gold-500/10 text-gold-500 border border-gold-500/30':'text-ink-200 hover:text-ink-50 hover:bg-ink-800 border border-transparent'}`}>
                <I p={ic[t.icon]} s={15}/>
                <span className="font-medium">{t.label}</span>
              </button>
            ))}
            {role==='admin'&&(
              <button onClick={()=>setTab('admin')}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-md transition-colors text-sm mt-3 ${tab==='admin'?'bg-gold-500/10 text-gold-500 border border-gold-500/30':'text-ink-200 hover:text-ink-50 hover:bg-ink-800 border border-transparent'}`}>

                          <div className="flex items-center gap-1.5 text-ink-300 text-xs mb-1">
                            <I p={ic.map} s={11} c="text-gold-500"/>{s.location}

                            <span className="w-1 h-1 bg-gold-500 rounded-full"/> {s.boxNumber}
                          </p>}
                          <span className="inline-block px-2.5 py-1 bg-ink-800 border border-ink-600 text-ink-200 text-[10px] font-medium rounded-md mt-2 mb-4 tracked-tight">
                            {s.subcategory}
                          </span>
                          <div className="grid grid-cols-2 gap-2">
                            <button onClick={e=>{e.stopPropagation();openWA(s.whatsapp,s.name,s.instagram);}}
                              className="btn-wapp flex items-center justify-center gap-1.5 py-2.5 rounded-md text-xs font-medium tracked-tight uppercase">
                              <I p={ic.msg} s={12}/> WhatsApp
                            </button>
                            <button onClick={e=>{e.stopPropagation();openIG(s.instagram,s.whatsapp,s.name);}}
                              className="btn-ghost flex items-center justify-center gap-1.5 py-2.5 rounded-md text-xs font-medium tracked-tight uppercase">
                              <I p={ic.camera} s={12}/> Instagram
                            </button>
                          </div>
                          <button onClick={e=>{e.stopPropagation();toggleCompare(s);}}
                            className={`mt-2 w-full flex items-center justify-center gap-1.5 py-2 rounded-md text-[10px] font-medium tracked-tight uppercase transition-colors ${compareList.find(x=>x.id===s.id)?'bg-gold-500/15 border border-gold-500/40 text-gold-400':'border border-ink-600 text-ink-500 hover:text-ink-300 hover:border-ink-500'}`}>
                            <I p={ic.layout} s={11}/> {compareList.find(x=>x.id===s.id)?'Comparando':'Comparar'}
                          </button>
                          {notes[s.id]&&<p className="text-[9px] text-ink-500 mt-2 truncate flex items-center gap-1"><I p={ic.edit} s={9}/> {notes[s.id]}</p>}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}

            {/* TAB: Treinamentos */}
            {tab==='training'&&(
              <div className="space-y-10">

                {/* ─── Módulo IA ─── */}
                <div>
                  <div className="flex items-center gap-3 mb-5">
                    <div className="w-9 h-9 bg-gold-500/10 border border-gold-500/30 rounded-md flex items-center justify-center text-gold-500 shrink-0">
                      <I p={ic.sparkle} s={17}/>
                    </div>
                    <div>
                      <h2 className="text-sm font-semibold text-ink-50 tracking-tight">IA para o Negócio</h2>
                      <p className="text-[10px] text-ink-400 mt-0.5">Prompts prontos para usar no ChatGPT, Gemini ou qualquer IA — copie e personalize</p>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {AI_PROMPTS.map(p=>(
                      <div key={p.id} className="bg-ink-900 border border-ink-600 rounded-lg p-5 flex flex-col gap-3 fade-up card-elite hover:border-gold-500/30 transition-colors">
                        <div className="flex items-start justify-between gap-2">
                          <span className="text-[9px] font-semibold text-gold-500 tracked uppercase bg-gold-500/10 px-2 py-0.5 rounded">{p.category}</span>

                        <button onClick={()=>setSelPrompt(p)}

                {/* ─── Aulas em Vídeo ─── */}

                  <div className="flex items-center gap-3 mb-5">
                    <div className="w-9 h-9 bg-ink-800 border border-ink-600 rounded-md flex items-center justify-center text-ink-200 shrink-0">
                      <I p={ic.play} s={17}/>
                    </div>
                    <div>
                      <h2 className="text-sm font-semibold text-ink-50 tracking-tight">Aulas em Vídeo</h2>
                      <p className="text-[10px] text-ink-400 mt-0.5">Estratégia, logística e vendas — direto ao ponto</p>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    {LESSONS.map(l=>(
                      <div key={l.id} className="bg-ink-900 border border-ink-600 rounded-lg overflow-hidden fade-up card-elite">
                        <div className="aspect-video relative overflow-hidden group bg-ink-800">
                          <img src={l.thumb} alt="" className="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500"
                            onError={e=>{e.target.style.display='none';}} loading="lazy"/>
                          <div className="absolute inset-0 bg-gradient-to-t from-ink-950/90 to-transparent"/>
                          <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <div className="bg-gold-500 rounded-full p-3">
                              <I p={ic.play} s={22} c="text-ink-950 fill-current"/>
                            </div>
                          </div>
                          <div className="absolute bottom-3 left-3 bg-ink-950/80 backdrop-blur-sm px-2.5 py-1 rounded-md text-[10px] font-medium text-gold-500 tracked uppercase border border-gold-500/30">
                            {l.duration}
                          </div>
                        </div>
                        <div className="p-5">
                          <span className="text-[10px] font-medium text-gold-500 tracked uppercase mb-2 block">{l.category}</span>
                          <h3 className="text-base font-medium text-ink-50 mb-2 tracking-tight">{l.title}</h3>
                          <p className="text-xs text-ink-300 mb-4 leading-relaxed">{l.desc}</p>
                          <button onClick={()=>setSelVideo(l)}
                            className="btn-ghost w-full py-2.5 rounded-md text-xs font-medium flex items-center justify-center gap-2 tracked-tight uppercase">
                            <I p={ic.play} s={12}/> Assistir
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

            {/* TAB: Ferramentas */}
            {tab==='tools'&&(
              <div className="space-y-6">
                <PricingCalc/>
                <div>
                  <div className="flex items-center gap-3 mb-4">
                    <div className="w-9 h-9 bg-ink-800 border border-ink-600 rounded-md flex items-center justify-center text-ink-200 shrink-0">
                      <I p={ic.file} s={17}/>
                    </div>
                    <div>
                      <h2 className="text-sm font-semibold text-ink-50 tracking-tight">Materiais para Download</h2>
                      <p className="text-[10px] text-ink-400 mt-0.5">Guias e planilhas em PDF</p>
                    </div>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                {TOOLS.map(t=>(
                  <div key={t.id} className="bg-ink-900 border border-ink-600 rounded-lg p-6 transition-colors flex flex-col items-start fade-up card-elite">
                    <div className="w-10 h-10 bg-gold-500/10 border border-gold-500/30 rounded-md flex items-center justify-center mb-4">
                      <I p={ic[t.icon==='Calculator'?'calc':t.icon==='FileText'?'file':'truck']} s={18} c="text-gold-500"/>
                    </div>
                    <div className="flex items-start justify-between mb-2">
                      <h3 className="text-base font-medium text-ink-50 tracking-tight">{t.title}</h3>
                      {t.downloadable && <span className="text-[8px] font-medium text-ink-950 tracked uppercase bg-gold-500 px-2 py-0.5 rounded shrink-0 ml-2">novo</span>}
                    </div>
                    <p className="text-xs text-ink-300 mb-5 leading-relaxed flex-1">{t.desc}</p>
                    <button onClick={()=>{
                        if(t.downloadable && t.filename) { downloadFile(t.filename); }
                        else { alert('Este material será disponibilizado em breve!'); }
                      }}
                      className={`font-medium text-xs flex items-center gap-1.5 transition-colors tracked-tight uppercase ${t.downloadable ? 'text-gold-500 hover:text-gold-400' : 'text-ink-300 hover:text-ink-200'}`}>
                      {t.downloadable ? <><I p={ic.arrowright} s={11}/> Baixar {t.type}</> : <><I p={ic.lock} s={11}/> Em breve</>}
                    </button>
                  </div>
                ))}
                  </div>
                </div>
                <ChecklistPanel/>
              </div>
            )}

            {/* TAB: Admin */}
            {tab==='admin'&&role==='admin'&&(
              <AdminPanel onSaved={loadSuppliers}/>
            )}

          </div>
        </div>
      </main>

      {/* Barra flutuante de comparação */}
      {compareList.length>0&&(
        <div className="fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-[150] w-full max-w-xl px-4">
          <div className="bg-ink-900 border border-gold-500/40 rounded-xl p-3 shadow-2xl flex items-center gap-3">
            <div className="flex-1 flex gap-2 flex-wrap">
              {compareList.map(s=>(
                <span key={s.id} className="flex items-center gap-1.5 bg-ink-800 border border-ink-600 rounded-md px-2.5 py-1.5 text-xs text-ink-100 font-medium">
                  {s.name.split(' ')[0]}
                  <button onClick={()=>toggleCompare(s)} className="text-ink-500 hover:text-red-400 transition-colors ml-1"><I p={ic.x} s={10}/></button>
                </span>
              ))}
            </div>
            <button onClick={()=>setSelSupplier('compare')}
              disabled={compareList.length<2}
              className="shrink-0 px-4 py-2 bg-gold-500 hover:bg-gold-400 disabled:opacity-40 text-ink-950 text-xs font-semibold tracked-tight uppercase rounded-lg transition-colors">
              Comparar {compareList.length>1?`(${compareList.length})`:''}
            </button>
            <button onClick={()=>setCompareList([])} className="shrink-0 text-ink-500 hover:text-ink-200 transition-colors"><I p={ic.x} s={16}/></button>
          </div>
        </div>
      )}

      {/* Modal Comparador */}
      <Modal open={selSupplier==='compare'} onClose={()=>setSelSupplier(null)}>
        <div className="bg-ink-950 border border-ink-600 rounded-lg overflow-hidden">
          <div className="p-5 border-b border-ink-700 flex items-center justify-between">
            <div>
              <h3 className="text-base font-semibold text-ink-50 tracking-tight">Comparador de Fornecedores</h3>
              <p className="text-[10px] text-ink-400 mt-0.5">{compareList.length} fornecedores selecionados</p>
            </div>
            <button onClick={()=>setSelSupplier(null)} className="p-2 bg-ink-900 hover:bg-ink-800 text-ink-100 rounded-md transition-colors"><I p={ic.x} s={14}/></button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead>
                <tr className="border-b border-ink-700">
                  <td className="p-3 text-[9px] font-semibold text-ink-500 tracked uppercase w-28">Campo</td>
                  {compareList.map(s=>(
                    <td key={s.id} className="p-3 font-semibold text-ink-50 text-center">{s.name}</td>
                  ))}
                </tr>
              </thead>
              <tbody>
                {[
                  {label:'Categoria',     fn:s=>s.category},
                  {label:'Subcategoria',  fn:s=>s.subcategory},
                  {label:'Localização',   fn:s=>s.location},
                  {label:'Pedido mín.',   fn:s=>s.minOrder||'Sob consulta'},
                  {label:'Envio',         fn:s=>s.shipping||'—'},
                  {label:'Fábrica',       fn:s=>s.isFactory?'Sim':'Não'},
                  {label:'WhatsApp',      fn:s=>s.whatsapp?'Disponível':'—'},
                  {label:'Instagram',     fn:s=>s.instagram||'—'},
                ].map(row=>(
                  <tr key={row.label} className="border-b border-ink-800 hover:bg-ink-900/50">
                    <td className="p-3 text-[9px] font-semibold text-ink-500 tracked uppercase">{row.label}</td>
                    {compareList.map(s=>(
                      <td key={s.id} className="p-3 text-ink-200 text-center leading-snug">{row.fn(s)}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="p-4 grid gap-2" style={{gridTemplateColumns:`repeat(${compareList.length},1fr)`}}>
            {compareList.map(s=>(
              <button key={s.id} onClick={()=>{setSelSupplier(null);setTimeout(()=>setSelSupplier(s),50);}}
                className="btn-ghost py-2.5 rounded-md text-xs font-medium text-center tracked-tight uppercase">
                Ver {s.name.split(' ')[0]}
              </button>
            ))}
          </div>
        </div>
      </Modal>

      {/* Modal Fornecedor */}
      <Modal open={!!selSupplier&&selSupplier!=='compare'} onClose={()=>setSelSupplier(null)}>
        {selSupplier&&(
          <div className="bg-ink-900 border border-ink-600 rounded-lg overflow-hidden">
            <button onClick={()=>setSelSupplier(null)}
              className="absolute top-4 right-4 p-2 bg-ink-950/70 hover:bg-ink-950 text-ink-100 rounded-md z-20 transition-colors backdrop-blur-sm">
              <I p={ic.x} s={16}/>
            </button>
            <div className="h-52 relative" style={{background:catBg(selSupplier.category)}}>
              <img src={selSupplier.image} className="w-full h-full object-cover opacity-90" alt=""
                onError={e=>{e.target.style.display='none';}} loading="lazy"/>
              <div className="absolute inset-0 bg-gradient-to-t from-ink-900 via-ink-900/30 to-transparent"/>
              <div className="absolute bottom-5 left-6 right-6">
                <span className="text-[10px] font-medium text-gold-500 tracked uppercase mb-2 inline-block px-2.5 py-1 border border-gold-500/30 rounded-md bg-ink-950/70 backdrop-blur-sm">{selSupplier.category}</span>
                <h2 className="text-2xl font-medium text-ink-50 tracking-tight">{selSupplier.name}</h2>
              </div>
            </div>
            <div className="p-7">
              <div className="grid sm:grid-cols-2 gap-6 mb-7">
                <div className="space-y-3">
                  <h4 className="text-[10px] font-medium text-ink-400 tracked uppercase">Informações</h4>
                  {[
                    {icon:'truck',label:'Envio',val:selSupplier.shipping},
                    {icon:'bag',label:'Pedido mínimo',val:selSupplier.minOrder||'A combinar'},
                  ].map((r,i)=>(
                    <div key={i} className="flex gap-2.5 items-start">
                      <div className="w-8 h-8 rounded-md bg-gold-500/10 border border-gold-500/30 flex items-center justify-center text-gold-500 shrink-0">
                        <I p={ic[r.icon]} s={14}/>
                      </div>
                      <div>
                        <p className="text-[10px] text-ink-400 font-medium tracked uppercase">{r.label}</p>
                        <p className="text-xs text-ink-100 mt-0.5">{r.val}</p>

                    </div>
                  ))}
                </div>
                <div className="space-y-3">
                  <h4 className="text-[10px] font-medium text-ink-400 tracked uppercase">Localização</h4>
                  <div className="flex gap-2.5 items-start">
                    <div className="w-8 h-8 rounded-md bg-gold-500/10 border border-gold-500/30 flex items-center justify-center text-gold-500 shrink-0">
                      <I p={ic.map} s={14}/>
                    </div>
                    <div>
                      <p className="text-[10px] text-ink-400 font-medium tracked uppercase">Endereço</p>
                      <p className="text-xs text-ink-100 mt-0.5">{selSupplier.location}</p>
                      {selSupplier.boxNumber&&<p className="text-[10px] text-gold-500 font-medium mt-1.5 tracked uppercase">{selSupplier.boxNumber}</p>}

                  </div>
                  <span className="inline-block px-2.5 py-1 bg-ink-800 border border-ink-600 text-ink-200 text-[10px] font-medium rounded-md mt-2 tracked-tight">{selSupplier.subcategory}</span>
                </div>
              </div>
              <div className="flex flex-col sm:flex-row gap-2.5">
                <button onClick={()=>openWA(selSupplier.whatsapp,selSupplier.name,selSupplier.instagram)}

                  <I p={ic.msg} s={14}/> Pedir no WhatsApp
                </button>
                <button onClick={()=>openIG(selSupplier.instagram,selSupplier.whatsapp,selSupplier.name)}
                  className="btn-ghost flex-1 flex items-center justify-center gap-2 py-3 rounded-md text-xs font-medium tracked-tight uppercase">
                  <I p={ic.camera} s={14}/> Ver Instagram
                </button>
              </div>

              {/* Notas privadas */}
              <div className="mt-5 pt-5 border-t border-ink-700">
                <label className="text-[10px] font-semibold text-ink-400 tracked uppercase block mb-2">
                  <I p={ic.edit} s={10} c="inline mr-1"/> Minhas anotações (privado)
                </label>
                <textarea
                  rows={3}
                  value={notes[selSupplier.id]||''}
                  onChange={e=>saveNote(selSupplier.id,e.target.value)}
                  placeholder="Ex: Entrei em contato dia 10/05, preço R$28/peça, qualidade ótima…"
                  className="w-full bg-ink-800 border border-ink-600 rounded-md px-3 py-2.5 text-xs text-ink-100 placeholder-ink-600 focus:outline-none focus:border-gold-500/50 resize-none transition-colors leading-relaxed"
                />

              </div>
            </div>
          </div>
        )}
      </Modal>

      {/* Modal Vídeo */}
      <Modal open={!!selVideo} onClose={()=>setSelVideo(null)}>
        {selVideo&&(
          <div className="bg-ink-950 border border-ink-600 rounded-lg overflow-hidden">
            <button onClick={()=>setSelVideo(null)}
              className="absolute top-4 right-4 p-2 bg-ink-900 hover:bg-ink-800 text-ink-100 rounded-md z-20 transition-colors">
              <I p={ic.x} s={14}/>
            </button>

            {/* Thumbnail clicável */}
            <a href={`https://www.youtube.com/watch?v=${selVideo.youtubeId}`}
              target="_blank" rel="noopener noreferrer"
              className="block relative aspect-video w-full overflow-hidden group bg-ink-900">
              <img
                src={`https://img.youtube.com/vi/${selVideo.youtubeId}/maxresdefault.jpg`}
                alt={selVideo.title}
                className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity duration-300"
                onError={e=>{e.target.src=`https://img.youtube.com/vi/${selVideo.youtubeId}/hqdefault.jpg`;}}
              />
              <div className="absolute inset-0 bg-ink-950/40 group-hover:bg-ink-950/20 transition-colors flex items-center justify-center">
                <div className="w-16 h-16 bg-red-600 group-hover:bg-red-500 rounded-full flex items-center justify-center transition-colors shadow-lg">
                  <I p={ic.play} s={26} c="text-white fill-current"/>
                </div>
              </div>
              <div className="absolute bottom-3 right-3 bg-ink-950/80 backdrop-blur-sm px-2 py-1 rounded text-[9px] font-medium text-ink-200 tracked uppercase">
                YouTube
              </div>
            </a>

            <div className="p-5">
              <span className="text-[9px] font-semibold text-gold-500 tracked uppercase">{selVideo.category}</span>
              <h3 className="text-base font-medium text-ink-50 tracking-tight mt-1 mb-2">{selVideo.title}</h3>
              <p className="text-xs text-ink-300 leading-relaxed mb-5">{selVideo.desc}</p>
              <a href={`https://www.youtube.com/watch?v=${selVideo.youtubeId}`}
                target="_blank" rel="noopener noreferrer"
                className="flex items-center justify-center gap-2 w-full py-3 bg-red-600 hover:bg-red-500 text-white rounded-md text-sm font-medium transition-colors tracked-tight uppercase">
                <I p={ic.play} s={15} c="fill-current"/>
                Assistir no YouTube
              </a>
            </div>
          </div>
        )}
      </Modal>

      {/* Modal Prompt IA */}
      <Modal open={!!selPrompt} onClose={()=>{setSelPrompt(null);setCopiedId(null);}}>
        {selPrompt&&(
          <div className="bg-ink-950 border border-ink-600 rounded-lg overflow-hidden">
            <button onClick={()=>{setSelPrompt(null);setCopiedId(null);}}
              className="absolute top-4 right-4 p-2 bg-ink-900 hover:bg-ink-800 text-ink-100 rounded-md z-20 transition-colors">
              <I p={ic.x} s={14}/>
            </button>
            <div className="p-6 sm:p-8">
              <div className="flex items-center gap-3 mb-5">
                <div className="w-9 h-9 bg-gold-500/10 border border-gold-500/30 rounded-md flex items-center justify-center text-gold-500 shrink-0">
                  <I p={ic.sparkle} s={16}/>
                </div>
                <div>
                  <span className="text-[9px] font-semibold text-gold-500 tracked uppercase">{selPrompt.category}</span>
                  <h3 className="text-base font-medium text-ink-50 tracking-tight leading-tight">{selPrompt.title}</h3>
                </div>
              </div>
              <p className="text-xs text-ink-300 leading-relaxed mb-4">{selPrompt.desc}</p>
              <div className="bg-ink-900 border border-ink-600 rounded-lg p-4 mb-5">
                <p className="text-[10px] font-semibold text-gold-500 tracked uppercase mb-2">Prompt</p>
                <p className="text-sm text-ink-100 leading-relaxed whitespace-pre-wrap">{selPrompt.prompt}</p>
              </div>
              <div className="bg-ink-800 border border-ink-600 rounded-md p-3 mb-5">
                <p className="text-[10px] text-ink-400 leading-relaxed">
                  <span className="text-gold-500 font-medium">Dica:</span> Substitua os termos entre colchetes <span className="font-mono text-gold-400">[ASSIM]</span> pelos dados do seu negócio antes de colar no ChatGPT, Gemini ou Claude.
                </p>
              </div>
              <button
                onClick={()=>{
                  navigator.clipboard.writeText(selPrompt.prompt).then(()=>{
                    setCopiedId(selPrompt.id);
                    setTimeout(()=>setCopiedId(null), 2500);
                  });
                }}
                className={`w-full py-3 rounded-md text-sm font-medium flex items-center justify-center gap-2 tracked-tight uppercase transition-all ${copiedId===selPrompt.id ? 'bg-green-600 text-white border border-green-500' : 'bg-gold-500 hover:bg-gold-400 text-ink-950'}`}>
                <I p={copiedId===selPrompt.id ? ic.check : ic.copy} s={15}/>
                {copiedId===selPrompt.id ? 'Copiado!' : 'Copiar Prompt'}
              </button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ─── APP ROOT ───────────────────────────────────────────── */
function App(){
  const{auth,role,authLoading,login,logout}=useAuth();
  const[page,setPage]=useState('landing');

  useEffect(()=>{ if(auth) setPage('dashboard'); },[auth]);
  const handleLogout=async()=>{ await logout(); setPage('landing'); };

  if(authLoading) return(
    <div className="min-h-screen bg-ink-950 flex items-center justify-center">
      <span className="w-8 h-8 border-2 border-gold-500 border-t-transparent rounded-full spin"/>
    </div>
  );

  if(page==='landing') return <LandingPage onGoLogin={()=>setPage('login')}/>;
  if(page==='login')   return <LoginPage onLogin={login} onBack={()=>setPage('landing')}/>;
  if(auth)             return <Dashboard role={role} onLogout={handleLogout}/>;
  return <LandingPage onGoLogin={()=>setPage('login')}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
