services:
  - type: web
    name: whatsapp-bot
    env: docker
    plan: free
    dockerfilePath: elite-atacado-brasil/whatsapp-bot/Dockerfile
    dockerContext: elite-atacado-brasil/whatsapp-bot
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
    autoDeploy: true
    healthCheckPath: /health
    region: oregon

